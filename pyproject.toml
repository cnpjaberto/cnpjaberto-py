[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnpjaberto"
version = "0.1.0"
description = "Python SDK and MCP server for cnpjaberto.com.br — open Brazilian company registry (CNPJ)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "CNPJ Aberto", email = "contato@cnpjaberto.com.br" }]
keywords = ["cnpj", "brasil", "receita-federal", "mcp", "claude", "company-registry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.6"]

[project.urls]
Homepage = "https://cnpjaberto.com.br"
Documentation = "https://cnpjaberto.com.br/docs/api"
Repository = "https://github.com/iagoassis-dev/cnpjaberto-py"
Issues = "https://github.com/iagoassis-dev/cnpjaberto-py/issues"

[project.scripts]
cnpjaberto-mcp = "cnpjaberto.cli:run_mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpjaberto"]
